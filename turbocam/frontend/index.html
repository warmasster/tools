<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TurboCAM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <header class="titlebar">
    <div class="brand">
      <img src="logo.svg" alt="" width="22" height="22">
      <span>Turbo<b>CAM</b></span>
    </div>
    <div class="pills" id="pills"></div>
    <div class="winbtns">
      <button class="wb" id="wb-float" title="Modo ventana: un visor siempre encima para compartirlo en una llamada"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="8" height="7" rx="1.5"/></svg></button>
      <button class="wb" id="wb-settings" title="Ajustes"><svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <span class="wsep"></span>
      <button class="wb" id="wb-min" title="Minimizar"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="wb" id="wb-max" title="Maximizar"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
      <button class="wb close" id="wb-close" title="Cerrar"><svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
  </header>

  <main class="main">
    <!-- ===== lo que sale por la cámara ===== -->
    <section class="left">
      <div class="stage-wrap" id="stage-wrap">
        <div class="stage" id="stage">
          <img id="out" alt="" draggable="false">
          <div class="empty" id="empty">
            <div class="empty-art"><div class="ring r1"></div><div class="ring r2"></div><img src="logo.svg" alt="" width="58" height="58"></div>
            <h2 id="empty-title">Esperando al móvil</h2>
            <p id="empty-text">Escanea el código QR con la cámara del móvil. No hace falta instalar nada.</p>
          </div>
          <div class="badge" id="badge"><i></i><span></span></div>
          <div class="res" id="res"></div>
          <div class="countdown" id="countdown" hidden></div>
          <div class="float-bar" id="float-bar">
            <button class="fb" id="fb-freeze" title="Congelar"><svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="m4.9 6.5 14.2 11"/><path d="m4.9 17.5 14.2-11"/><path d="m9 4 3 2 3-2"/><path d="m9 20 3-2 3 2"/></svg></button>
            <button class="fb" id="fb-cover" title="Tapar"><svg viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/></svg></button>
            <button class="fb" id="fb-top" title="Siempre encima"><svg viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></button>
            <button class="fb" id="fb-exit" title="Volver a la ventana normal"><svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg></button>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="a-photo"><svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>Foto<kbd id="k-photo"></kbd></button>
        <button class="btn ghost" id="a-freeze"><svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="m4.9 6.5 14.2 11"/><path d="m4.9 17.5 14.2-11"/><path d="m9 4 3 2 3-2"/><path d="m9 20 3-2 3 2"/></svg><span>Congelar</span><kbd id="k-freeze"></kbd></button>
        <button class="btn ghost" id="a-cover"><svg viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/></svg><span>Tapar</span><kbd id="k-cover"></kbd></button>
        <span class="grow"></span>
        <button class="btn ghost sm" id="a-photos" title="Abrir la carpeta de las fotos"><svg viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"/></svg>Fotos</button>
      </div>

      <div class="scene" id="scene">
        <div class="scene-head">
          <b>Escena</b>
          <div class="seg" id="scene-kind">
            <button data-k="phone">Móvil</button>
            <button data-k="screen">Pantalla</button>
            <button data-k="pip">Imagen sobre imagen</button>
          </div>
        </div>
        <div class="scene-body" id="scene-body"></div>
      </div>
    </section>

    <!-- ===== panel derecho ===== -->
    <aside class="side">
      <div class="seg tabs" id="tabs">
        <button data-t="connect">Conectar</button>
        <button data-t="phones">Móviles <em id="n-phones"></em></button>
        <button data-t="profiles">Perfiles</button>
      </div>
      <div class="pane" id="p-connect"></div>
      <div class="pane" id="p-phones"></div>
      <div class="pane" id="p-profiles"></div>
    </aside>
  </main>

  <div class="toasts" id="toasts"></div>
  <div id="modal-root"></div>
</div>
<script src="app.js"></script>
</body>
</html>
