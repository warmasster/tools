<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>TurboDL</title>
  <link rel="stylesheet" href="ui/theme.css">
  <link rel="stylesheet" href="ui/popup.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="icons/icon48.png" alt="">
    <div class="title">
      <strong>TurboDL</strong>
      <span id="state-text" class="sub">Interceptación activada</span>
      <span id="engine-text" class="engine"></span>
    </div>
    <label class="switch" title="Activar o desactivar la interceptación">
      <input id="enabled" type="checkbox" aria-label="Interceptar descargas">
      <span></span>
    </label>
  </header>

  <section class="summary" id="summary">
    <div><span class="num" id="active-count">0</span><span class="cap">activas</span></div>
    <div><span class="num" id="speed">—</span><span class="cap">velocidad total</span></div>
  </section>

  <section class="recent" aria-label="Descargas recientes">
    <div id="recent-list" class="recent-list"></div>
    <p id="recent-empty" class="recent-empty" hidden>Aún no hay descargas.</p>
  </section>

  <button id="open-manager" class="btn primary wide">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    Abrir gestor de descargas
  </button>

  <details class="settings" id="settings-box">
    <summary>Ajustes <span class="saved">Guardado</span></summary>
    <div id="settings" class="fields"></div>
  </details>

  <footer class="foot">
    <span id="shortcut"></span>
    <span class="faint">Clic derecho en un enlace → <em>Descargar con TurboDL</em></span>
  </footer>

  <script type="module" src="ui/popup.js"></script>
</body>
</html>
