<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0b12">
<title>Te han enviado archivos · Enviador</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/share.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
<div class="grain" aria-hidden="true"></div>

<main class="wrap">
  <header class="brand">
    <img src="/assets/logo.svg" alt="" width="30" height="30">
    <span>Enviador</span>
  </header>

  <section class="card" id="card" aria-live="polite">
    <div class="skeleton">
      <div class="sk sk-icon"></div>
      <div class="sk sk-line w60"></div>
      <div class="sk sk-line w40"></div>
      <div class="sk sk-btn"></div>
    </div>
  </section>

  <p class="foot" id="foot">Los archivos viajan directamente desde el ordenador de quien te los envía. No se guardan en ningún servidor.</p>
</main>

<script src="/assets/share.js"></script>
</body>
</html>
